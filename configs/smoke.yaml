run:
  name: smoke
  root: runs
data:
  training_dir: data/training
  test_dir: data/test
  test_limit: 3
models:
  pretrained_generator: models/trained_generator_cfg.pt
  pretrained_discriminator: models/trained_discriminator_cfg.pt
  fresh_generator: models/fresh_generator_cfg.pt
  fresh_discriminator: models/fresh_discriminator_cfg.pt
llm:
  model_env: PROMSEC_LLM_MODEL
  api_key_env: OPENAI_API_KEY
  base_url_env: PROMSEC_LLM_BASE_URL
  temperature: 0.0
  max_retries: 1
  cache_path: cache/llm_cache.sqlite
  syntax_repair_attempts: 1
loop:
  max_iterations: 1
guidance:
  top_k: 5
  min_abs_change: 0.1
judge:
  model_env: PROMSEC_JUDGE_MODEL
  api_key_env: OPENAI_API_KEY
  base_url_env: PROMSEC_JUDGE_BASE_URL
  temperature: 0.0
  max_retries: 1
  stability_check: true
  calibration_limit: 2
training:
  seed: 0
  epochs: 1
  learning_rate: 0.001
  discriminator_steps: 1
  limit: 5
  validation_fraction: 0.1
  train_from_scratch: 0
  resume: true
  alpha: 1.0
  beta: 10.0
  lambda_adv: 0.01
  security_margin: 0.25
  negatives: 16
  label_workers: 8
supervisor:
  max_training_passes: 1
  max_enforcement_passes: 1
  max_judge_passes: 1
  retry_seconds: 5
