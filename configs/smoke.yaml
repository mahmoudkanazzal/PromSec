# Quick end-to-end check: 3 programs, 1 iteration.
base: configs/default.yaml
run:
  name: smoke
data:
  test_limit: 3
llm:
  max_retries: 1
  syntax_repair_attempts: 1
loop:
  max_iterations: 1
  parallel_programs: 3
judge:
  max_retries: 1
  calibration_limit: 2
supervisor:
  max_enforcement_passes: 1
  max_judge_passes: 1
  retry_seconds: 5
